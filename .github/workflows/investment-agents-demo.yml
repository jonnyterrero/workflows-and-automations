name: Investment Agents Demo

on:
  pull_request:
    paths:
      - "trading-intelligence-agent/packages/investment_agents/**"
      - "trading-intelligence-agent/scripts/run_investment_committee_demo.py"
      - "trading-intelligence-agent/tests/unit/test_investment_agents.py"
      - "trading-intelligence-agent/pyproject.toml"
      - ".github/workflows/investment-agents-demo.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-demo:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: trading-intelligence-agent

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: trading-intelligence-agent/pyproject.toml

      - name: Install project
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Run focused unit tests
        env:
          DEMO_MODE: "true"
          DATABASE_URL: sqlite+aiosqlite:///./data/test_trading_intel.db
        run: pytest tests/unit/test_investment_agents.py -v --tb=short

      - name: Run offline committee demo
        env:
          DEMO_MODE: "true"
          DATABASE_URL: sqlite+aiosqlite:///./data/test_trading_intel.db
        run: |
          mkdir -p output
          python -m scripts.run_investment_committee_demo > output/investment-committee-demo.json
          python -m json.tool output/investment-committee-demo.json > /dev/null
          cat output/investment-committee-demo.json

      - name: Upload demo dossier
        uses: actions/upload-artifact@v4
        with:
          name: investment-committee-demo
          path: trading-intelligence-agent/output/investment-committee-demo.json
          if-no-files-found: error
