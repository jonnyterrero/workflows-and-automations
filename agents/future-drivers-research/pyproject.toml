[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "future-drivers-research"
version = "0.1.0"
description = "Collaborative future-drivers investment research platform on Claude Managed Agents"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Jonny Terrero", email = "dijinvestments3@gmail.com" }]

dependencies = [
    "anthropic>=0.120.0",
    "pydantic>=2.8.0",
    "httpx>=0.27.0",
    "pyyaml>=6.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.6.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/fdr"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B"]
# UP042: `str, Enum` rather than `StrEnum`, matching the convention in the
# sibling trading-intelligence-agent package.
ignore = ["E501", "UP042"]

[tool.ruff.lint.isort]
known-first-party = ["fdr"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.coverage.run]
source = ["src/fdr"]
omit = ["tests/*"]
