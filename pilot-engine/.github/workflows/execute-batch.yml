name: Pilot Engine execute approved batch

on:
  workflow_dispatch:
    inputs:
      batch_id:
        description: Firestore order_batches document ID
        required: true
        type: string

permissions:
  contents: read

jobs:
  approval-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Install Python 3.12
        run: uv python install 3.12

      - name: Sync locked dependencies
        run: uv sync --locked

      - name: Configure Firebase Admin credentials
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
        run: |
          if [ -z "$FIREBASE_SERVICE_ACCOUNT_JSON" ]; then
            echo "::error::FIREBASE_SERVICE_ACCOUNT_JSON is not configured"
            exit 1
          fi
          credentials_file="$RUNNER_TEMP/firebase-service-account.json"
          umask 077
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT_JSON" > "$credentials_file"
          python -m json.tool "$credentials_file" > /dev/null
          echo "GOOGLE_APPLICATION_CREDENTIALS=$credentials_file" >> "$GITHUB_ENV"

      - name: Require approved batch status
        env:
          BATCH_ID: ${{ inputs.batch_id }}
        run: uv run python execute/public_client.py --batch-id "$BATCH_ID"
