[project]
name = "pilot-engine"
version = "0.1.0"
description = "Recommend-only copy-trading signal and order-batch engine"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "firebase-admin>=7.5.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: requires the local Firebase emulator",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.3",
]
